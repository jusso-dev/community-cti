# Homelab test deployment. LAN and tailnet only: the portal and the Mailpit
# inbox are the only published ports. Secrets come from .env (mode 600) next
# to this file and are generated by deploy.sh; nothing secret is committed.
name: community-cti-homelab

x-app: &app
  image: community-cti:homelab
  restart: unless-stopped
  environment: &app-env
    CTI_ENV: ${CTI_ENV:-test}
    PORTAL_BASE_URL: ${PORTAL_BASE_URL}
    # PaperBoy (homelab transactional email) is used when both are set;
    # otherwise mail falls back to the local Mailpit inbox.
    PAPERBOY_URL: ${PAPERBOY_URL:-}
    PAPERBOY_API_KEY: ${PAPERBOY_API_KEY:-}
    SMTP_URL: smtp://mailpit:1025
    MAIL_FROM: ${MAIL_FROM:-Community CTI <alerts@community-cti.homelab>}
    EMAIL_REGION: ap-southeast-2
    DATA_REGION: ap-southeast-2

services:
  postgres:
    image: postgres:16.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: cti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: cti
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cti -d cti"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *app
    restart: "no"
    command: ["node", "packages/db/dist/cli.js"]
    environment:
      DATABASE_URL: postgres://cti:${POSTGRES_PASSWORD}@postgres:5432/cti
      CTI_APP_PASSWORD: ${CTI_APP_PASSWORD:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *app-env
      START_SERVER: "1"
      PORT: "8080"
      DATABASE_URL_APP: postgres://cti_app:${CTI_APP_PASSWORD}@postgres:5432/cti
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set in .env}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  portal:
    <<: *app
    command: ["node", "apps/portal/dist/main.js"]
    environment:
      <<: *app-env
      START_SERVER: "1"
      PORT: "3000"
      API_URL: http://api:8080
    ports:
      - "${PORTAL_PORT:-3330}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy

  worker:
    <<: *app
    command: ["node", "apps/worker/dist/index.js"]
    environment:
      <<: *app-env
      START_WORKER: "1"
      DATABASE_URL: postgres://cti:${POSTGRES_PASSWORD}@postgres:5432/cti
      RAW_DIR: /data/raw
      TEST_APPROVED_SOURCES: ${TEST_APPROVED_SOURCES:-}
      THREATSIEVE_TAXII_URL: ${THREATSIEVE_TAXII_URL:-}
      THREATSIEVE_API_KEY: ${THREATSIEVE_API_KEY:-}
      NVD_API_KEY: ${NVD_API_KEY:-}
      WORKER_JOBS: ${WORKER_JOBS:-}
    volumes:
      - rawdata:/data
    depends_on:
      migrate:
        condition: service_completed_successfully

  mailpit:
    image: axllent/mailpit:v1.21.8
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-18084}:8025"

volumes:
  pgdata:
  rawdata:

# Homelab Docker's default address pools are used up, so pin a subnet that
# does not overlap the LAN, other Docker networks, K3s or Tailscale.
networks:
  default:
    ipam:
      config:
        - subnet: ${CTI_SUBNET:-10.231.30.0/24}
